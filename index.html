<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KytchenPulseUI_v1.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone-screen">
      <header class="top-bar">
        <div class="status-time">8:33</div>
        <div class="status-icons">
          <span class="icon signal"></span>
          <span class="icon wifi"></span>
          <span class="icon battery"></span>
        </div>
      </header>

      <section class="toolbar">
        <button aria-label="Close" class="circle-btn">✕</button>
        <h1>KytchenPulseUI_v1.0</h1>
        <button aria-label="More" class="circle-btn">•••</button>
      </section>

      <section class="hero-area">
        <article class="login-card">
          <div class="left-panel">
            <div class="tagline">
              <p>Your kitchen.</p>
              <h2>Your rhythm.<br /><span>Perfected.</span></h2>
            </div>

            <div class="illustration" aria-hidden="true">
              <div class="window window-a"></div>
              <div class="window window-b"></div>
              <div class="counter"></div>
              <div class="chef"></div>
              <div class="plant"></div>
            </div>
          </div>

          <div class="right-panel">
            <div class="logo-wrap">
              <div class="logo-main">Kytchen</div>
              <div class="logo-sub">Pulse</div>
            </div>

            <h3>Login</h3>
            <label>Email</label>
            <input type="email" placeholder="olivia@untitledui.com" />
            <label>Password</label>
            <input type="password" placeholder="••••••••" />

            <div class="row">
              <label class="remember"><input type="checkbox" /> Remember me</label>
              <a href="#">Forgot Password</a>
            </div>

            <button class="login-btn">Login</button>

            <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
